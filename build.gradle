plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.2-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group
archivesBaseName = project.archives_base_name

sourceCompatibility = targetCompatibility = JavaVersion.toVersion(project.java_version)

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(sourceCompatibility.majorVersion.toInteger()))
    }
}

repositories {
    maven {
        name = 'spongepowered-repo'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    maven {
        name = 'fabric-maven'
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
}

unimined.minecraft(sourceSets.main) {
    version project.minecraft_version

    mappings {
        mojmap()

        devFallbackNamespace "official"
    }

    fabric {
        loader project.fabric_loader_version
    }
}

dependencies {
    compileOnly "org.spongepowered:mixin:${project.mixin_version}"
    compileOnly "org.ow2.asm:asm:${project.asm_version}"

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // The bytecode audit reads the compiled classes with ASM (9.9: reads Java 25 class files).
    testImplementation "org.ow2.asm:asm:9.9.1"
    // Minecraft's own Gson version (26.1), for the clip loader under test.
    testImplementation "com.google.code.gson:gson:2.13.2"
}

test {
    useJUnitPlatform()
    // The audit scans what was compiled, so it needs the main classes' folder.
    systemProperty "nylah.classes", sourceSets.main.output.classesDirs.asPath
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = project.java_version as Integer
}
