plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.2-SNAPSHOT'
}

// One Minecraft line per build (-Pmc=26.2); see gradle.properties.
def mc = project.mc
def mcProp = { String key ->
    def v = project.findProperty("mc${mc}.${key}")
    if (v == null) throw new GradleException("Unknown Minecraft line '${mc}': no mc${mc}.${key} in gradle.properties")
    v
}

version = "${project.mod_version}+${mc}".toString()
group = project.maven_group
archivesBaseName = project.archives_base_name

sourceCompatibility = targetCompatibility = JavaVersion.toVersion(project.java_version)

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(sourceCompatibility.majorVersion.toInteger()))
    }
}

repositories {
    maven {
        name = 'spongepowered-repo'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    maven {
        name = 'fabric-maven'
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
}

// The handful of calls that differ between Minecraft lines.
sourceSets.main.java.srcDir "src/mc${mc}/java"

unimined.minecraft(sourceSets.main) {
    version mcProp('minecraft_version')

    mappings {
        mojmap()

        devFallbackNamespace "official"
    }

    fabric {
        loader mcProp('fabric_loader_version')
    }
}

dependencies {
    compileOnly "org.spongepowered:mixin:${project.mixin_version}"
    compileOnly "org.ow2.asm:asm:${project.asm_version}"

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // The bytecode audit reads the compiled classes with ASM (9.9: reads Java 25 class files).
    testImplementation "org.ow2.asm:asm:9.9.1"
    // Minecraft's own Gson version, for the clip loader under test.
    testImplementation "com.google.code.gson:gson:${mcProp('gson_version')}"
}

test {
    useJUnitPlatform()
    // The audit scans what was compiled, so it needs the main classes' folder.
    systemProperty "nylah.classes", sourceSets.main.output.classesDirs.asPath
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}

processResources {
    def meta = [
        version: project.version,
        loader: mcProp('fabric_loader_version'),
        minecraft: mcProp('minecraft_depends'),
    ]
    inputs.properties meta

    filesMatching("fabric.mod.json") {
        expand meta
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = project.java_version as Integer
}
