org.gradle.jvmargs=-Xmx3G

mod_version=1.0.5
maven_group=com.smartypantsltd
archives_base_name=nylah

java_version=25

# Which Minecraft line to build for: ./gradlew build (26.1) or ./gradlew build -Pmc=26.2.
