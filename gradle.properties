mc26.1.minecraft_version=26.1
mc26.1.fabric_loader_version=0.18.6
mc26.1.minecraft_depends=>=26.1 <=26.1.2
mc26.1.gson_version=2.13.2

# Fabulously Optimized 14.x (Fabric loader 0.19.5).
mc26.2.minecraft_version=26.2
mc26.2.fabric_loader_version=0.19.5
mc26.2.minecraft_depends=26.2
mc26.2.gson_version=2.14.0

mixin_version=0.8.7
asm_version=9.7
junit_version=5.11.4
