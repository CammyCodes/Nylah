pluginManagement {
    repositories {
        mavenLocal()
        maven {
            name = 'WagYourMavenSnapshots'
            url = 'https://maven.wagyourtail.xyz/snapshots'
        }
        maven {
            name = 'WagYourMaven'
            url = 'https://maven.wagyourtail.xyz/releases'
        }
        maven {
            name = 'FabricMaven'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal() {
            content {
                excludeGroup "org.apache.logging.log4j"
            }
        }
    }
}

rootProject.name = 'nylah'
